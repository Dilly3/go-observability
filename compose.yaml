services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dilly3
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dilly3 -d wallet_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  adminer:
    image: adminer:6.1.2
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: